name: Build Modded IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        type: choice
        default: release_arm64
        options:
          - release_arm64
          - debug_arm64
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 350

    steps:
      - name: Check required secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::error::Missing TELEGRAM_API_ID / TELEGRAM_API_HASH repository secrets."
            echo "::error::Create your own application at https://my.telegram.org/apps and add the two secrets in repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Set up canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-
            bazel-${{ runner.os }}-

      - name: Import fake codesigning certificates
        run: |
          cd /Users/Shared/telegram-ios
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Generate build configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          cd /Users/Shared/telegram-ios
          cat > build-system/ci-configuration.json <<EOF
          {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "${TELEGRAM_API_ID}",
            "api_hash": "${TELEGRAM_API_HASH}",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "false",
            "is_appstore_build": "true",
            "appstore_id": "686449807",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false,
            "sg_config": ""
          }
          EOF
          echo "Configuration written (bundle ph.telegra.Telegraph, fake team C67CF9S4VU — the sideload tool rewrites the bundle id when signing)."

      - name: Build
        env:
          BUILD_CONFIG: ${{ inputs.configuration || 'release_arm64' }}
        run: |
          set -o pipefail
          cd /Users/Shared/telegram-ios

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            build \
            --configurationPath="build-system/ci-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration="$BUILD_CONFIG" \
            --buildNumber="$BUILD_NUMBER" 2>&1 | tee build.log | tail -200

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-${{ github.sha }}

      - name: Collect artifacts
        run: |
          cd /Users/Shared/telegram-ios
          mkdir -p build/artifacts
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" build/artifacts/
          done
          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            [ -e "$f" ] && cp -R "$f" build/DSYMs/
          done
          if [ -d build/DSYMs ] && [ -n "$(ls -A build/DSYMs 2>/dev/null)" ]; then
            zip -r "./build/artifacts/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null
          fi
          ls -la build/artifacts/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftgramMod-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            /Users/Shared/telegram-ios/build/artifacts/*.ipa
            /Users/Shared/telegram-ios/build/artifacts/*.zip
          if-no-files-found: error

      - name: Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Swiftgram Mod ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          files: |
            /Users/Shared/telegram-ios/build/artifacts/*.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
